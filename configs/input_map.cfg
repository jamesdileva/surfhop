; Velocity Engine - default key bindings (canonical reference).
; The authoritative runtime source of truth is project.godot [input];
; user overrides are persisted to user://save/bindings.cfg.
; Keycodes use Godot 4 KEY_* constants.

[keyboard]

move_forward=87   ; W
move_back=83      ; S
move_left=65      ; A
move_right=68     ; D
jump=32           ; Space
duck=4194326      ; Ctrl
sprint=4194325    ; Shift

[controller]

; Controller bindings reserved (future).
