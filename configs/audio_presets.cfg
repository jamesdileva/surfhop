; Audio bus presets and tuning constants (architecture §13).
; Values are linear 0..1 unless noted. Consumed by AudioManager/Settings.

[presets]
default={"master": 0.8, "music": 0.6, "sfx": 0.9, "ui": 1.0}
quiet={"master": 0.5, "music": 0.3, "sfx": 0.6, "ui": 0.8}
muted={"master": 0.0, "music": 0.0, "sfx": 0.0, "ui": 0.0}

[surf_loop]
; Pitch scales with horizontal speed while surfing.
pitch_min=0.7
pitch_max=1.8
speed_reference=500

[footsteps]
stride_distance=110
speed_threshold=50

[music]
; Stations: drop audio/music/<station>.wav or .ogg and set
; audio/music_track in settings (Sprint 26 adds the dropdown).
stations="placeholder"
